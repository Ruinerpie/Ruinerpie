<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More Storage Stack</title>
    <meta name="description" content="More Storage Stack is a Minecraft Mod created by Ruinerpie.">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Inter:wght@400..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary-red: #e63946;
            --color-bg-base: #030103;
            --color-bg-darker: #0d0a12;
            --color-text-primary: #eee;
            --color-text-secondary: #bcb5c0;
            --color-border-primary: #2e2228;
            --backdrop-lg: blur(16px);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, var(--color-bg-darker), var(--color-bg-base));
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(0deg, rgba(230, 57, 70, 0.03) 0px, rgba(230, 57, 70, 0.03) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: -1;
            animation: scanlines 8s linear infinite;
        }
        
        @keyframes scanlines {
            100% { background-position: 0 8px; }
        }

        .btn-back {
            position: fixed;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 0;
            background: rgba(8, 6, 12, 0.5);
            border: 1px solid var(--color-border-primary);
            color: var(--color-text-primary);
            text-decoration: none;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            transition: all 0.18s ease;
            transform: scale(1);
            backdrop-filter: var(--backdrop-lg);
            z-index: 100;
        }

        .btn-back:hover {
            color: var(--color-primary-red);
            border-color: var(--color-primary-red);
            transform: scale(0.993);
        }

        .project-container {
            max-width: 800px;
            width: 100%;
            padding: 0;
            position: relative;
            z-index: 2;
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .icon-container {
            width: 72px;
            height: 72px;
            background: transparent;
            padding: 0;
            border-radius: 8px;
            position: relative;
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
        }

        .icon-container:hover {
            border-color: #ffd700;
        }

        .icon-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4d5a, #b91c2c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }

        p.description {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            text-align: left;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn-modrinth {
            background: rgba(0, 175, 92, 0.15);
            color: #1bd96a;
            border: 1px solid rgba(0, 175, 92, 0.3);
        }

        .btn-modrinth:hover {
            background: #00AF5C;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 175, 92, 0.6);
            transform: scale(1.08);
        }
        
        .btn-modrinth img {
            transition: filter 0.3s ease;
        }
        
        .btn-modrinth:hover img {
            filter: brightness(0) invert(1);
        }

        .btn-curseforge {
            background: rgba(241, 100, 54, 0.15);
            color: #ff7d52;
            border: 1px solid rgba(241, 100, 54, 0.3);
        }

        .btn-curseforge:hover {
            background: #F16436;
            color: #fff;
            box-shadow: 0 0 20px rgba(241, 100, 54, 0.6);
            transform: scale(1.08);
        }
        
        .btn-curseforge img {
            transition: filter 0.3s ease;
        }
        
        .btn-curseforge:hover img {
            filter: brightness(0) invert(1);
        }

        .btn-discord {
            background: rgba(88, 101, 242, 0.15);
            color: #5865F2;
            border: 1px solid rgba(88, 101, 242, 0.3);
        }

        .btn-discord:hover {
            background: #5865F2;
            color: #fff;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.6);
            transform: scale(1.08);
        }
        
        .btn-discord img {
            transition: filter 0.3s ease;
        }
        
        .btn-discord:hover img {
            filter: brightness(0) invert(1);
        }

    </style>
</head>
<body>
    <a href="../../index.html#projects" onclick="history.back(); return false;" class="btn-back" title="Go Back">X</a>
    
    <div class="project-container">
        <div class="project-header">
            <div class="icon-container">
                <img src="MSS.png" alt="More Storage Stack Icon" />
            </div>
            <h1>More Storage Stack</h1>
        </div>
        
        <p class="description">
            MSS (MoreStorageStack) Lets You Increase Your Minecraft Item Stack Sizes All The Way Up To 4096.
        </p>
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
            <div class="action-buttons">
                <a href="https://modrinth.com/mod/morestoragestack" target="_blank" class="btn btn-modrinth">
                    <img src="https://cdn.simpleicons.org/modrinth/00AF5C" alt="" width="18" height="18" />
                    Get on Modrinth
                </a>
                <a href="https://www.curseforge.com/minecraft/mc-mods/morestoragestack" target="_blank" class="btn btn-curseforge">
                    <img src="https://cdn.simpleicons.org/curseforge/F16436" alt="" width="18" height="18" />
                    Get on CurseForge
                </a>
            </div>
            <a href="https://discord.gg/g2NVCrxfUE" target="_blank" class="btn btn-discord">
                <img src="https://cdn.simpleicons.org/discord/5865F2" alt="" width="18" height="18" />
                Mod Support
            </a>
        </div>
    </div>

    <script>
        const pCanvas = document.createElement('canvas');
        pCanvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;';
        document.body.prepend(pCanvas);
        const pCtx = pCanvas.getContext('2d');

        function pResize() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
        }
        pResize();
        window.addEventListener('resize', pResize);

        const projectParticles = [];
        let pMouseX = -9999;
        let pMouseY = -9999;

        window.addEventListener('mousemove', function(e) {
            pMouseX = e.clientX;
            pMouseY = e.clientY;
        });

        window.addEventListener('mouseleave', function() {
            pMouseX = -9999;
            pMouseY = -9999;
        });

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!prefersReducedMotion) {
            for (let i = 0; i < 90; i++) {
                projectParticles.push({
                    x: Math.random() * pCanvas.width,
                    y: Math.random() * pCanvas.height,
                    baseVx: (Math.random() - 0.5) * 0.15,
                    baseVy: 0.05 + Math.random() * 0.15,
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: 0.05 + Math.random() * 0.15,
                    size: 4 + Math.random() * 3,
                    alpha: 0.35 + Math.random() * 0.25,
                    cr: 235,
                    cg: 65,
                    cb: 115
                });
            }
        }

        function pRender() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            if (!prefersReducedMotion) {
                for (const p of projectParticles) {
                    if (pMouseX > -1000 && pMouseY > -1000) {
                        const cdx = p.x - pMouseX;
                        const cdy = p.y - pMouseY;
                        const cdist = Math.hypot(cdx, cdy) || 1;
                        if (cdist < 70) {
                            const repSpeed = (1 - cdist / 70) * 0.28;
                            const nx = cdx / cdist;
                            const ny = cdy / cdist;
                            p.vx = p.vx * 0.85 + nx * repSpeed;
                            p.vy = p.vy * 0.85 + ny * repSpeed;
                        }
                    }

                    p.x += p.vx;
                    p.y += p.vy;

                    p.vx = p.vx * 0.98 + p.baseVx * 0.02;
                    p.vy = p.vy * 0.98 + p.baseVy * 0.02;

                    if (p.y > pCanvas.height + 15) { p.y = -10; p.x = Math.random() * pCanvas.width; }
                    if (p.y < -15) { p.y = pCanvas.height + 10; p.x = Math.random() * pCanvas.width; }
                    if (p.x < -15) { p.x = pCanvas.width + 10; p.y = Math.random() * pCanvas.height; }
                    if (p.x > pCanvas.width + 15) { p.x = -10; p.y = Math.random() * pCanvas.height; }

                    pCtx.fillStyle = 'rgba(' + Math.round(p.cr) + ',' + Math.round(p.cg) + ',' + Math.round(p.cb) + ',' + p.alpha + ')';
                    pCtx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                }
            }
            requestAnimationFrame(pRender);
        }
        pRender();
    </script>
</body>
</html>
