<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More Storage Stack - Ruinerpie</title>
    <meta name="description" content="More Storage Stack is a Minecraft Mod created by Ruinerpie.">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Inter:wght@400..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary-red: #e63946;
            --color-bg-base: #030103;
            --color-bg-darker: #0d0a12;
            --color-text-primary: #eee;
            --color-text-secondary: #bcb5c0;
            --color-border-primary: #2e2228;
            --backdrop-lg: blur(16px);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, var(--color-bg-darker), var(--color-bg-base));
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(0deg, rgba(230, 57, 70, 0.03) 0px, rgba(230, 57, 70, 0.03) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: -1;
            animation: scanlines 8s linear infinite;
        }
        
        @keyframes scanlines {
            100% { background-position: 0 8px; }
        }

        .btn-back {
            position: fixed;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 0;
            background: rgba(8, 6, 12, 0.5);
            border: 1px solid var(--color-border-primary);
            color: var(--color-text-primary);
            text-decoration: none;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            transition: all 0.18s ease;
            transform: scale(1);
            backdrop-filter: var(--backdrop-lg);
            z-index: 100;
        }

        .btn-back:hover {
            color: var(--color-primary-red);
            border-color: var(--color-primary-red);
            transform: scale(0.993);
        }

        .project-container {
            max-width: 800px;
            width: 100%;
            padding: 0;
            position: relative;
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .icon-container {
            width: 72px;
            height: 72px;
            background: transparent;
            padding: 0;
            border-radius: 8px;
            position: relative;
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
        }

        .icon-container:hover {
            border-color: #ffd700;
        }

        .icon-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4d5a, #b91c2c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }

        p.description {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            text-align: left;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn-modrinth {
            background: rgba(0, 175, 92, 0.15);
            color: #1bd96a;
            border: 1px solid rgba(0, 175, 92, 0.3);
        }

        .btn-modrinth:hover {
            background: #00AF5C;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 175, 92, 0.6);
            transform: scale(1.08);
        }
        
        .btn-modrinth img {
            transition: filter 0.3s ease;
        }
        
        .btn-modrinth:hover img {
            filter: brightness(0) invert(1);
        }

        .btn-curseforge {
            background: rgba(241, 100, 54, 0.15);
            color: #ff7d52;
            border: 1px solid rgba(241, 100, 54, 0.3);
        }

        .btn-curseforge:hover {
            background: #F16436;
            color: #fff;
            box-shadow: 0 0 20px rgba(241, 100, 54, 0.6);
            transform: scale(1.08);
        }
        
        .btn-curseforge img {
            transition: filter 0.3s ease;
        }
        
        .btn-curseforge:hover img {
            filter: brightness(0) invert(1);
        }

        .btn-discord {
            background: rgba(88, 101, 242, 0.15);
            color: #5865F2;
            border: 1px solid rgba(88, 101, 242, 0.3);
        }

        .btn-discord:hover {
            background: #5865F2;
            color: #fff;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.6);
            transform: scale(1.08);
        }
        
        .btn-discord img {
            transition: filter 0.3s ease;
        }
        
        .btn-discord:hover img {
            filter: brightness(0) invert(1);
        }

    </style>
</head>
<body>
    <a href="../../index.html#projects" onclick="history.back(); return false;" class="btn-back" title="Go Back">X</a>
    
    <div class="project-container">
        <div class="project-header">
            <div class="icon-container">
                <img src="MSS.png" alt="More Storage Stack Icon" />
            </div>
            <h1>More Storage Stack</h1>
        </div>
        
        <p class="description">
            MSS (MoreStorageStack) Lets You Increase Your Minecraft Item Stack Sizes All The Way Up To 4096.
        </p>
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
            <div class="action-buttons">
                <a href="https://modrinth.com/mod/morestoragestack" target="_blank" class="btn btn-modrinth">
                    <img src="https://cdn.simpleicons.org/modrinth/00AF5C" alt="" width="18" height="18" />
                    Get on Modrinth
                </a>
                <a href="https://www.curseforge.com/minecraft/mc-mods/morestoragestack" target="_blank" class="btn btn-curseforge">
                    <img src="https://cdn.simpleicons.org/curseforge/F16436" alt="" width="18" height="18" />
                    Get on CurseForge
                </a>
            </div>
            <a href="https://discord.gg/g2NVCrxfUE" target="_blank" class="btn btn-discord">
                <img src="https://cdn.simpleicons.org/discord/5865F2" alt="" width="18" height="18" />
                Mod Support
            </a>
        </div>
    </div>
</body>
</html>
